# define paths
paths:
  measurement: ...
  id_to_unit: ...

# define joins for source table
joins:
  concept:
    path: ...
    keys: ["concept_id", "concept_name"]
    on:
      measurement_concept_id: concept_id
    cardinality: one
  concept_ancestor:
    path: ...
    keys: ["descendant_concept_id", "ancestor_concept_id"]
    on:
      measurement_concept_id: descendant_concept_id
    cardinality: many

# define how to extract numeric value, text value, and unit
values:
  numeric_value: 'F.coalesce(F.col("value_as_number"), F.col("value_source_value").try_cast("double"))'
  text_value: 'F.when(F.col("value_source_value").try_cast("double").isNull(), F.col("value_source_value"))'
  unit: 'F.col("unit_source_value")'

